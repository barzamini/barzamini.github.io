# Navigation
navigation:
  - title: "About"
    url: "/about/"
  - title: "Publications"
    url: "/publications/"
  - title: "News"
    url: "/news/"
  - title: "CV"
    url: "/cv/"

# Jekyll Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Theme (using minimal theme as base)
theme: minima

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md

# Build settings
sass:
  style: compressed

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

