<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | default: 'Academic website' }}"/>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and page.title != "Home" %}
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      {% endif %}

      <nav class="navigation">
        {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>

      {{ content }}

      <footer class="site-footer">
        <div class="social-links">
          {% for social in site.social %}
          <a href="{{ social.link }}" target="_blank" rel="noopener noreferrer" aria-label="{{ social.name }}">
            <i class="{{ social.icon }}"></i>
          </a>
          {% endfor %}
        </div>
        <p class="footer-text">
          &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}. All rights reserved.
        </p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
